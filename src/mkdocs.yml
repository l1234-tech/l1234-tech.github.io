site_name: Портфолио Сырчина Андрея
site_author: Сырчин Андрей
site_description: Портфолио — проекты, хакатоны, достижения и учебная деятельность

docs_dir: docs
site_dir: docs

theme:
  name: material
  language: ru
  palette:
    - scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Переключить на тёмную тему
    - scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Переключить на светлую тему
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.expand
    - search.highlight
    - content.code.copy

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/l1234-tech
    - icon: fontawesome/brands/telegram
      link: https://t.me/@dark_kurom1
    - icon: material/email
      link: mailto:syrchin.andrej@inbox.ru

copyright: © 2026 Сырчин Андрей

nav:
  - Главная: index.md
  - Обо мне: about.md
  - Проекты:
    - Главная: projects/index.md
    - ML-сервис: projects/ml-service.md
    - Перцептрон на C++: projects/perceptron.md
    - AI-ассистент для онкологии: projects/oncology-assistant.md
    - Просвещённый абсолютизм Екатерины II: projects/catherine-ii.md
  - Хакатоны:
    - Главная: hackathons/index.md
    - Проектная школа «Авито»: hackathons/avito.md
    - Хакатон «Цифровое здоровье»: hackathons/digital-health.md
  - Учебная деятельность:
    - Лабораторные работы:
      - Главная: labs/index.md
      - Лаба 1: labs/lab1.md
      - Лаба 2: labs/lab2.md
      - Лаба 3: labs/lab3.md
      - Лаба 9: labs/lab9.md
    - Материалы:
      - Главная: materials/index.md
